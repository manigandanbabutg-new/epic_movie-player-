<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova AI - 3D Cinema</title>

  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #030407;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 18px 24px;
      background: #090b11;
      border-bottom: 1px solid #222735;

      justify-content: space-between;
      align-items: center;

    button {

    @media (max-width: 600px) {
      .cinema { height: 55vh; }

    }
  </style>
</head>

<body>
  <header>
    <h2>NOVA CINEMA</h2>
    <span>3D PANORAMIC PLAYER</span>
  </header>

  <main>
    <section class="cinema">
      <!-- The video is the shared texture source -->
      <video
        id="movie"
        crossorigin="anonymous"
        playsinline
        preload="auto"
        loop
        src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"
        style="display:none">
      </video>

      <a-scene
        embedded
        vr-mode-ui="enabled: false"
        renderer="colorManagement: true; antialias: true"
        background="color: #030407"
        loading-screen="enabled: false">

        <a-assets>
          <a-mixin
            id="panel-material"
            material="shader: flat; side: double">
          </a-mixin>
        </a-assets>

        <!-- All panels share the same curved video texture -->
        <a-entity
          id="leftWing"
          video-panel="start: -55; end: -20; uStart: 0; uEnd: 0.318">
        </a-entity>

        <a-entity
          id="centerScreen"
          video-panel="start: -20; end: 20; uStart: 0.318; uEnd: 0.682">
        </a-entity>

        <a-entity
          id="rightWing"
          video-panel="start: 20; end: 55; uStart: 0.682; uEnd: 1">
        </a-entity>

        <!-- Cinema floor -->
        <a-plane
          position="0 -2.5 -2"
          rotation="-90 0 0"
          width="200"
          height="200"
          color="#080b12">
        </a-plane>

        <!-- Low ambient lighting -->
        <a-light type="ambient" color="#b8c9ff" intensity="0.5">
        </a-light>

        <a-light
          type="point"
          position="0 2 -3"
          color="#318bff"
          intensity="0.5">
        </a-light>

        <!-- Viewer looks straight at the center panel -->
        <a-camera
          position="0 0 0"
          look-controls="enabled: true"
          wasd-controls="enabled: true">
        </a-camera>

      </a-scene>
    </section>

    <section class="controls">
      <h3>Movie controls</h3>

      <div class="url-row">
        <input
          id="videoURL"
          type="url"
          placeholder="Paste a direct MP4 video URL">
        <button id="loadBtn">Load video</button>
      </div>

      <div class="buttons">
        <button id="playBtn">▶ Play</button>
        <button id="pauseBtn">Ⅱ Pause</button>
        <button id="muteBtn">🔇 Mute</button>
        <button id="fullscreenBtn">⛶ Fullscreen</button>
      </div>

      <p id="status">
        Loading sample movie... Enter a direct MP4 URL to change it.
      </p>
    </section>
  </main>

  <script>
    // Create curved panels and map the correct section
    // of the same video texture onto each panel.
    AFRAME.registerComponent("video-panel", {
      schema: {
        start: { type: "number" },
        end: { type: "number" },
        uStart: { type: "number" },
        uEnd: { type: "number" }
      },

      init: function () {
        const data = this.data;
        const video = document.querySelector("#movie");

        const radius = 5;
        const height = 3.5;
        const segments = 48;

        const vertices = [];
        const uvs = [];
        const indices = [];

        for (let i = 0; i <= segments; i++) {
          const t = i / segments;
          const angle =
            (data.start + (data.end - data.start) * t)
            * Math.PI / 180;

          const x = radius * Math.sin(angle);
          const z = -radius * Math.cos(angle);
          const u = data.uStart +
            (data.uEnd - data.uStart) * t;

          // Top vertex
          vertices.push(x, height / 2, z);
          uvs.push(u, 1);

          // Bottom vertex
          vertices.push(x, -height / 2, z);
          uvs.push(u, 0);

          if (i < segments) {
            const a = i * 2;
            const b = a + 1;
            const c = a + 2;
            const d = a + 3;

            indices.push(a, b, c);
            indices.push(b, d, c);
          }
        }

        const geometry = new THREE.BufferGeometry();

        geometry.setAttribute(
          "position",
          new THREE.Float32BufferAttribute(vertices, 3)
        );

        geometry.setAttribute(
          "uv",
          new THREE.Float32BufferAttribute(uvs, 2)
        );

        geometry.setIndex(indices);
        geometry.computeVertexNormals();

        const texture = new THREE.VideoTexture(video);

        texture.colorSpace = THREE.SRGBColorSpace;
        texture.minFilter = THREE.LinearFilter;
        texture.magFilter = THREE.LinearFilter;
        texture.generateMipmaps = false;

        const material = new THREE.MeshBasicMaterial({
          map: texture,
          side: THREE.DoubleSide,
          toneMapped: false
        });

        this.mesh = new THREE.Mesh(geometry, material);
        this.el.object3D.add(this.mesh);
      },

      remove: function () {
        if (!this.mesh) return;

        this.mesh.geometry.dispose();
        this.mesh.material.dispose();
        this.mesh.material.map?.dispose();

        this.el.object3D.remove(this.mesh);
      }
    });

    const video = document.getElementById("movie");
    const status = document.getElementById("status");

    // Play video after a user action if autoplay is blocked.
    document.getElementById("playBtn").onclick = async () => {
      try {
        await video.play();
        status.textContent = "Movie playing.";
      } catch (error) {
        status.textContent =
          "Press Play again or check whether the video URL is accessible.";
      }
    };

    document.getElementById("pauseBtn").onclick = () => {
      video.pause();
      status.textContent = "Movie paused.";
    };

    document.getElementById("muteBtn").onclick = () => {
      video.muted = !video.muted;
      document.getElementById("muteBtn").textContent =
        video.muted ? "🔇 Unmute" : "🔊 Mute";
    };

    document.getElementById("loadBtn").onclick = async () => {
      const url = document.getElementById("videoURL").value.trim();

      if (!url) {
        status.textContent = "Enter a direct MP4 video URL.";
        return;
      }

      try {
        new URL(url);
      } catch {
        status.textContent = "Please enter a valid video URL.";
        return;
      }

      video.pause();
      video.src = url;
      video.load();

      status.textContent = "Loading your movie...";

      try {
        await new Promise((resolve, reject) => {
          video.onloadeddata = resolve;
          video.onerror = () => reject(
            new Error("The video could not be loaded.")
          );
        });

        await video.play();
        status.textContent = "Your panoramic movie is playing.";
      } catch (error) {
        status.textContent =
          "Could not play this URL. Use a direct, browser-compatible MP4 link.";
      }
    };

    document.getElementById("fullscreenBtn").onclick = () => {
      document.querySelector(".cinema").requestFullscreen?.();
    };

    video.addEventListener("canplay", () => {
      status.textContent =
        "Sample video ready. Press Play to begin.";
    });

    video.addEventListener("error", () => {
      status.textContent =
        "Video unavailable. Try another direct MP4 URL.";
    });
  </script>
</body>
</html>
